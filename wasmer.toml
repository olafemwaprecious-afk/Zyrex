[package]
name = "obafemip715/zyrex-backend"
version = "0.1.0"
description = "ZYREX AI trading intelligence API"
readme = "README.md"

[dependencies]
"wasmer/winterjs" = "*"

[fs]
"/src" = "./src"

[[command]]
name = "server"
module = "wasmer/winterjs:winterjs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/src/index.js"]
